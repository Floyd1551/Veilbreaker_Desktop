name: Android companion
on:
  push:
    paths: ['android-companion/**', '.github/workflows/android.yml', 'src/veilbreaker/android_capture.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests and debug APK
        working-directory: android-companion
        run: gradle testDebugUnitTest assembleDebug --no-daemon
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate Kotlin fixture with Desktop contract
        env:
          PYTHONPATH: src
        run: python -c "from pathlib import Path; from veilbreaker.android_capture import load_capture; [print(load_capture(p)['sha256']) for p in [Path('android-companion/app/build/contract-fixture.json'), Path('android-companion/app/build/session-fixture.json')]]"
      - uses: actions/upload-artifact@v4
        with:
          name: veilbreaker-android-debug
          path: |
            android-companion/app/build/outputs/apk/debug/*.apk
            android-companion/app/build/reports/tests/
            android-companion/app/build/*fixture.json
