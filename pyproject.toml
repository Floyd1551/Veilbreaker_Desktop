[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veilbreaker-desktop"
version = "0.22.0rc1"
description = "Explainable field network diagnostics for Windows and Linux"
requires-python = ">=3.11"
dependencies = ["pyserial==3.5"]

[project.optional-dependencies]
desktop = ["PySide6==6.11.2"]
build = ["PyInstaller==6.22.0"]

[project.scripts]
veilbreaker = "veilbreaker.cli:main"

[project.gui-scripts]
veilbreaker-desktop = "veilbreaker.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
veilbreaker = ["assets/*"]
